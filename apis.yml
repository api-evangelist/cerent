name: Cerent
description: >-
  Cerent Corporation was a Petaluma, California optical-networking startup, founded in the
  mid-1990s and backed by Kleiner Perkins, that built the Cerent 454 — a compact
  next-generation SONET multiservice provisioning platform that collapsed traditional
  add-drop multiplexing into a far smaller, cheaper, data-aware box for carrier metro
  networks. Cisco Systems acquired Cerent in 1999 for approximately $6.9 billion in stock,
  at the time the largest acquisition in Cisco's history, and the product line shipped on as
  the Cisco ONS 15454, one of Cisco's most successful optical transport platforms. Cerent has
  not operated as an independent company since. Its hardware-era business predated public web
  APIs entirely, and it maintains no developer platform, documentation, SDKs, or API surface
  today — the cerent.com domain is now held by Cisco and serves only an acquisition notice.
  This profile is retained as a venture-portfolio historical record, not an active API provider.
